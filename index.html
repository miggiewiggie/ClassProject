<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Engineering Study Guide</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: white;
      transition: background-color 0.3s, color 0.3s;
    }
    .dark-mode {
      background-color: #1a202c;
      color: white;
    }
    /* Header Section with Blue Background */
    header {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #007bff; /* Blue background */
      color: #ffffff;
      padding: 10px 20px;
      width: 100%;
      overflow: hidden;
    }
    .menu-btn {
      position: absolute;
      left: 10px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.75rem;
      color: black;
      transition: color 0.3s ease;
    }
    .dark-mode .menu-btn {
      color: white;
    }
    .sidebar {
      position: fixed;
      top: 0;
      left: -250px;
      width: 250px;
      height: 100%;
      background: white;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      padding-top: 8rem;
      transition: left 0.3s ease, background-color 0.3s ease;
    }
    .dark-mode .sidebar {
      background: #2d3748;
    }
    .sidebar a {
      padding: 1rem;
      text-decoration: none;
      color: black;
      font-size: 1rem;
    }
    .dark-mode .sidebar a {
      color: white;
    }
    .sidebar a:hover {
      background-color: #f1f1f1;
    }
    .dark-mode .sidebar a:hover {
      background-color: #4a5568;
    }
    main {
      padding: 2rem;
      text-align: center;
    }
    .majors {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2rem;
      justify-content: center;
      margin-top: 2rem;
    }
    .major-item {
      text-align: center;
      background: #f7f7f7;
      padding: 1rem;
      border: 1px solid #cbd5e0;
      border-radius: 5px;
    }
    .dark-mode .major-item {
      background: #2d3748;
      border-color: #4a5568;
    }
    .major-item img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      display: block;
      margin: 0 auto;
      border-radius: 5px;
    }
    .major-item a {
      display: block;
      text-decoration: none;
      color: black;
      font-size: 1.2rem;
      margin-top: 0.5rem;
    }
    .dark-mode .major-item a {
      color: white;
    }
  </style>
</head>
<body onload="applyDarkMode(localStorage.getItem('darkMode') === 'true')" onclick="closeMenu(event)">
  <header>
    <button class="menu-btn" id="menuBtn">☰</button>
    <h1>UCF Computer Science/Engineering Major Study Guide</h1>
  </header>
  <nav>
    <div class="sidebar" id="sidebar">
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="help.html">Help</a>
      <a href="#" id="darkModeToggle">Dark Mode / Light Mode</a>
    </div>
  </nav>
  <main>
    <h1>Select Your Major</h1>
    <div class="majors">
      <div class="major-item">
        <a href="it.html">
          <img src="it.jpg" alt="IT" />
          IT
        </a>
      </div>
      <div class="major-item">
        <a href="cs.html">
          <img src="cs.jpg" alt="Computer Science" />
          Computer Science
        </a>
      </div>
      <div class="major-item">
        <a href="aerospace.html">
          <img src="aerospace.jpg" alt="Aerospace Engineering" />
          Aerospace Engineering
        </a>
      </div>
      <div class="major-item">
        <a href="civil.html">
          <img src="civil.jpg" alt="Civil Engineering" />
          Civil Engineering
        </a>
      </div>
      <div class="major-item">
        <a href="mechanical.html">
          <img src="mechanical.jpg" alt="Mechanical Engineering" />
          Mechanical Engineering
        </a>
      </div>
      <div class="major-item">
        <a href="computer.html">
          <img src="computer.png" alt="Computer Engineering" />
          Computer Engineering
        </a>
      </div>
    </div>
  </main>
  <script>
    function applyDarkMode(isDarkMode) {
      if (isDarkMode) {
        document.body.classList.add("dark-mode");
        document.getElementById("sidebar").classList.add("dark-mode");
        document.getElementById("menuBtn").style.color = "white";
      } else {
        document.body.classList.remove("dark-mode");
        document.getElementById("sidebar").classList.remove("dark-mode");
        document.getElementById("menuBtn").style.color = "black";
      }
    }
    document.getElementById("menuBtn").addEventListener("click", function(event) {
      event.stopPropagation();
      const sidebar = document.getElementById("sidebar");
      sidebar.style.left = sidebar.style.left === "0px" ? "-250px" : "0px";
    });
    document.getElementById("darkModeToggle").addEventListener("click", function(event) {
      event.preventDefault();
      const isDark = document.body.classList.toggle("dark-mode");
      document.getElementById("sidebar").classList.toggle("dark-mode");
      localStorage.setItem("darkMode", isDark);
      document.getElementById("menuBtn").style.color = isDark ? "white" : "black";
    });
    function closeMenu(event) {
      const sidebar = document.getElementById("sidebar");
      if (!sidebar.contains(event.target) && event.target.id !== "menuBtn") {
        sidebar.style.left = "-250px";
      }
    }
  </script>
</body>
</html>
